[package]
name = "single_rwa_vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = "1"
# Pin to avoid re-resolving onto ed25519-dalek v3, which is incompatible with
# soroban-env-host 22.1.3's test utilities (ChaCha20Rng no longer satisfies its
# CryptoRng bound). See Cargo.lock, which is committed for reproducibility.
ed25519-dalek = "=2.2.0"

[features]
testutils = ["soroban-sdk/testutils"]
